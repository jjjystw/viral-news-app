<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="바이럴뉴스">
<meta name="description" content="국내 주요 언론사 RSS를 모아 바이럴 점수로 정리한 오늘의 핫뉴스">
<title>바이럴 뉴스 — 오늘의 핫이슈</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="icon-192.png" sizes="192x192">
<style>
  :root{
    --bg:#08090c;
    --bg-soft:#0d0f14;
    --card:#14161d;
    --card-2:#191c24;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);
    --tx:#f2f4f8;
    --tx-2:#a7aebc;
    --tx-3:#6f7787;
    --hot:#ff4d3d;
    --hot-2:#ff8a3d;
    --accident:#ff6b6b;
    --absurd:#ffc24b;
    --warm:#ff8fb1;
    --issue:#74a8ff;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --r:20px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(700px 380px at 12% -8%, rgba(255,77,61,.16), transparent 60%),
      radial-gradient(560px 320px at 105% 4%, rgba(116,168,255,.13), transparent 62%),
      radial-gradient(600px 400px at 50% 108%, rgba(255,143,177,.07), transparent 65%);
  }
  .app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  header.top{
    position:sticky;top:0;z-index:40;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(8,9,12,.78);
    -webkit-backdrop-filter:saturate(180%) blur(22px);
    backdrop-filter:saturate(180%) blur(22px);
    border-bottom:1px solid var(--line);
  }
  .top-row{display:flex;align-items:center;gap:10px}
  .logo{
    width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(150deg,#ff5a3d,#ff9b3d 60%,#ffcf5a);
    box-shadow:0 6px 18px rgba(255,110,60,.35);
  }
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand b{font-size:17px;letter-spacing:-.3px}
  .brand span{font-size:11px;color:var(--tx-3);letter-spacing:.1px;margin-top:2px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .live{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#ff8f7a;
    background:rgba(255,77,61,.12);border:1px solid rgba(255,77,61,.25);
    padding:5px 9px;border-radius:999px;letter-spacing:.2px;
  }
  .live i{width:6px;height:6px;border-radius:50%;background:#ff5a45;box-shadow:0 0 0 0 rgba(255,90,69,.7);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,69,.6)}70%{box-shadow:0 0 0 7px rgba(255,90,69,0)}100%{box-shadow:0 0 0 0 rgba(255,90,69,0)}}
  .icon-btn{
    width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);
    color:var(--tx-2);display:grid;place-items:center;cursor:pointer;padding:0;
  }
  .icon-btn:active{transform:scale(.94)}

  /* ---------- stale banner ---------- */
  .stale{
    display:none;margin:10px 16px 0;padding:10px 12px;border-radius:14px;font-size:12px;
    background:rgba(255,194,75,.1);border:1px solid rgba(255,194,75,.25);color:#ffd88a;
    align-items:center;gap:8px;
  }
  .stale.on{display:flex}
  .stale button{
    margin-left:auto;background:#ffc24b;color:#20180a;border:0;border-radius:9px;
    font-size:11px;font-weight:800;padding:6px 9px;cursor:pointer;font-family:inherit;
  }

  /* ---------- filter bar ---------- */
  .filters{padding:12px 0 4px}
  .seg{
    margin:0 16px;display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);
  }
  .seg button{
    flex:1;border:0;background:transparent;color:var(--tx-2);font-family:inherit;font-size:12.5px;font-weight:700;
    padding:8px 6px;border-radius:10px;cursor:pointer;transition:background .18s,color .18s;
    display:flex;align-items:center;justify-content:center;gap:5px;
  }
  .seg button.on{background:linear-gradient(180deg,#2b3040,#232734);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .chips{
    display:flex;gap:7px;overflow-x:auto;padding:10px 16px 2px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx-2);
    font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;
    transition:background .18s,color .18s,border-color .18s;white-space:nowrap;
  }
  .chip.on{background:#fff;color:#0b0c10;border-color:#fff}
  .chip .n{font-size:11px;font-weight:800;opacity:.55;margin-left:4px}
  .cats{padding-top:8px}

  /* ---------- section title ---------- */
  .sec-head{
    display:flex;align-items:baseline;gap:8px;padding:16px 18px 8px;
  }
  .sec-head h2{margin:0;font-size:13px;letter-spacing:.2px;color:var(--tx-2);font-weight:800;text-transform:none}
  .sec-head span{font-size:11.5px;color:var(--tx-3)}
  .sec-head .line{flex:1;height:1px;background:var(--line)}

  /* ---------- feed ---------- */
  .feed{display:flex;flex-direction:column;gap:11px;padding:2px 14px 8px}
  .card{
    position:relative;background:linear-gradient(168deg,var(--card-2),var(--card));
    border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 11px;
    box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer;
    transition:transform .14s ease,border-color .18s ease;
    overflow:hidden;
  }
  .card:active{transform:scale(.985)}
  .card.top1{border-color:rgba(255,196,77,.45);box-shadow:0 8px 26px rgba(255,120,40,.18)}
  .card.top2{border-color:rgba(198,208,224,.32)}
  .card.top3{border-color:rgba(212,150,100,.3)}
  .card.top1::after{
    content:"";position:absolute;right:-40px;top:-60px;width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,150,60,.22),transparent 65%);pointer-events:none;
  }
  .c-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
  .rank{
    min-width:22px;height:22px;padding:0 5px;border-radius:7px;display:inline-grid;place-items:center;
    font-size:11.5px;font-weight:900;color:#8d95a6;background:rgba(255,255,255,.06);letter-spacing:-.2px;
  }
  .rank.r1{background:linear-gradient(150deg,#ffd166,#ff9a3d);color:#2a1600;box-shadow:0 2px 8px rgba(255,160,60,.4)}
  .rank.r2{background:linear-gradient(150deg,#e7ecf5,#a9b4c6);color:#1b202a}
  .rank.r3{background:linear-gradient(150deg,#e5b48b,#bd8459);color:#2a1509}
  .tag{
    font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:-.1px;white-space:nowrap;
  }
  .tag.사건사고{color:#ffb0b0;background:rgba(255,107,107,.14);border:1px solid rgba(255,107,107,.22)}
  .tag.얼탱없음{color:#ffd789;background:rgba(255,194,75,.13);border:1px solid rgba(255,194,75,.22)}
  .tag.감동{color:#ffbdd2;background:rgba(255,143,177,.13);border:1px solid rgba(255,143,177,.22)}
  .tag.이슈{color:#b6d0ff;background:rgba(116,168,255,.13);border:1px solid rgba(116,168,255,.22)}
  .badge-b{font-size:10px;font-weight:900;color:#ff7a63;background:rgba(255,77,61,.14);border:1px solid rgba(255,77,61,.28);padding:3px 6px;border-radius:6px}
  .c-top .sp{margin-left:auto}
  .score{
    display:inline-flex;align-items:baseline;gap:1px;font-weight:900;padding:4px 8px;border-radius:9px;
    font-size:14px;letter-spacing:-.4px;background:rgba(255,255,255,.06);color:#cfd6e3;
  }
  .score i{font-style:normal;font-size:9.5px;font-weight:800;opacity:.65;margin-left:1px}
  .score.s-hi{background:linear-gradient(150deg,#ff5a3d,#ff9a3d);color:#2a0d00;box-shadow:0 3px 12px rgba(255,90,55,.35)}
  .score.s-md{background:rgba(255,150,70,.16);color:#ffbd8a;border:1px solid rgba(255,150,70,.3)}
  .title{
    margin:0 0 5px;font-size:15.5px;line-height:1.38;font-weight:800;letter-spacing:-.35px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .summary{
    margin:0;font-size:12.5px;color:var(--tx-2);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .vpoint{
    margin:8px 0 0;font-size:11.5px;color:#ffb9a4;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .vpoint b{color:#ff8a6d;font-weight:900;margin-right:3px}
  .c-foot{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.055)}
  .pub{font-size:11.5px;font-weight:700;color:#c3cad8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
  .meta-dot{color:var(--tx-3);font-size:10px}
  .ago{font-size:11.5px;color:var(--tx-3);white-space:nowrap}
  .c-foot .sp{margin-left:auto}
  .bm{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    color:#7d8697;display:grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto;
  }
  .bm.on{color:#ffd166;border-color:rgba(255,209,102,.4);background:rgba(255,209,102,.12)}
  .src{
    display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:#9fb8e8;
    text-decoration:none;padding:6px 8px;border-radius:8px;background:rgba(116,168,255,.08);border:1px solid rgba(116,168,255,.16);
    white-space:nowrap;
  }
  .src:active{opacity:.7}
  .thumb{
    width:100%;height:142px;border-radius:13px;margin:2px 0 9px;
    object-fit:cover;object-position:center;background:#1e2230;
    border:1px solid rgba(255,255,255,.05);display:block;
  }
  .thumb.sm{height:112px}

  /* ---------- time view ---------- */
  .group{margin-top:6px}
  .g-head{
    position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:20;
    display:flex;align-items:center;gap:8px;padding:9px 18px;
    background:rgba(8,9,12,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .g-head b{font-size:12px;color:#e8ecf4;font-weight:800}
  .g-head .n{font-size:11px;color:var(--tx-3)}
  .g-head .line{flex:1;height:1px;background:var(--line)}
  .g-head .bar{width:3px;height:12px;border-radius:2px;background:linear-gradient(#ff8a3d,#ff4d3d)}

  /* ---------- breaking view ---------- */
  .rail{position:relative;padding:4px 14px 8px 44px}
  .rail::before{content:"";position:absolute;left:36px;top:6px;bottom:24px;width:2px;background:linear-gradient(#ff5a45,rgba(255,90,69,.08))}
  .rail .card{margin-bottom:11px}
  .rail .card::before{
    content:"";position:absolute;left:-14px;top:22px;width:9px;height:9px;border-radius:50%;
    background:#ff5a45;box-shadow:0 0 0 3px rgba(255,90,69,.16);
  }
  .rail .t-abs{position:absolute;left:-34px;top:25px;font-size:10px;font-variant-numeric:tabular-nums;color:#8b93a3;margin-left:-40px;width:38px;text-align:right}

  /* ---------- empty ---------- */
  .empty{padding:64px 28px;text-align:center;color:var(--tx-3)}
  .empty .ic{font-size:34px;margin-bottom:12px;opacity:.85}
  .empty b{display:block;color:var(--tx-2);font-size:14px;margin-bottom:6px}
  .empty p{font-size:12.5px;line-height:1.6;margin:0}

  /* ---------- tabbar ---------- */
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-width:430px;margin:0 auto;
    padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(10,11,15,.86);
    -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
    border-top:1px solid var(--line);
    display:flex;
  }
  nav.tabbar button{
    flex:1;border:0;background:transparent;color:#767f90;font-family:inherit;font-size:10.5px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;cursor:pointer;position:relative;
  }
  nav.tabbar button .ic{width:23px;height:23px;display:grid;place-items:center}
  nav.tabbar button.on{color:#fff}
  nav.tabbar button.on .ic{color:#ff7a4d;filter:drop-shadow(0 0 8px rgba(255,120,70,.45))}
  nav.tabbar button .dot{
    position:absolute;top:3px;right:calc(50% - 17px);min-width:15px;height:15px;border-radius:8px;
    background:#ff4d3d;color:#fff;font-size:9px;font-weight:900;display:none;place-items:center;padding:0 3px;
  }
  nav.tabbar button .dot.on{display:grid}

  /* ---------- sheet ---------- */
  .sheet-wrap{position:fixed;inset:0;z-index:80;display:none}
  .sheet-wrap.on{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
  .sheet-wrap.on .backdrop{opacity:1}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;
    max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg,#191c25,#0f1117 70%);
    border-radius:24px 24px 0 0;border:1px solid var(--line-2);border-bottom:0;
    padding:8px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.9,.24,1);
    box-shadow:0 -18px 60px rgba(0,0,0,.6);
  }
  .sheet-wrap.on .sheet{transform:translateY(0)}
  .handle{width:38px;height:4px;border-radius:2px;background:#3a3f4d;margin:2px auto 12px}
  .sh-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .sh-top .rank{margin:0}
  .ring{
    margin-left:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--hot) calc(var(--v)*1%),rgba(255,255,255,.07) 0);
    position:relative;flex:0 0 auto;
  }
  .ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#141720}
  .ring .v{position:relative;font-size:21px;font-weight:900;letter-spacing:-.8px;line-height:1;text-align:center}
  .ring .v i{font-style:normal;font-size:9px;font-weight:800;opacity:.6;margin-left:1px;letter-spacing:0}
  .sh-title{margin:0 0 8px;font-size:20px;line-height:1.35;font-weight:900;letter-spacing:-.5px}
  .sh-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11.5px;color:var(--tx-3);margin-bottom:16px}
  .sh-meta b{color:#c9d0dd;font-weight:700}
  .sh-meta .sep{opacity:.5}
  .blk{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:11px}
  .blk h4{margin:0 0 7px;font-size:11px;font-weight:900;color:#8d96a7;letter-spacing:.4px}
  .blk p{margin:0;font-size:13.5px;line-height:1.62;color:#dfe4ee}
  .blk.vp{background:linear-gradient(140deg,rgba(255,110,70,.13),rgba(255,110,70,.04));border-color:rgba(255,120,80,.22)}
  .blk.vp p{color:#ffcbbd;font-size:13px}
  .metrics{display:flex;flex-direction:column;gap:11px}
  .m-row{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:9px}
  .m-row span{font-size:11.5px;color:var(--tx-2);font-weight:700}
  .m-bar{height:7px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .m-bar i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .m-row b{font-size:11.5px;text-align:right;color:#dfe4ee;font-variant-numeric:tabular-nums}
  .m1 i{background:linear-gradient(90deg,#4f8bff,#74a8ff)}
  .m2 i{background:linear-gradient(90deg,#ff4d3d,#ff9a3d)}
  .m3 i{background:linear-gradient(90deg,#b06bff,#ff8fb1)}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 16px}
  .tagrow .tg{font-size:11px;font-weight:700;color:#a9b3c4;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:4px 9px;border-radius:999px}
  .sh-actions{display:flex;gap:8px;margin-top:2px}
  .btn{
    flex:1;border:0;border-radius:14px;font-family:inherit;font-size:14px;font-weight:900;padding:14px 12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
  }
  .btn.primary{background:linear-gradient(150deg,#ff5a3d,#ff9a3d);color:#2a0d00;box-shadow:0 8px 22px rgba(255,110,50,.3)}
  .btn.ghost{flex:0 0 54px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#cfd6e3;font-size:18px}
  .btn.ghost.on{color:#ffd166;background:rgba(255,209,102,.12);border-color:rgba(255,209,102,.35)}
  .btn:active{transform:scale(.98)}

  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
    background:rgba(28,31,40,.96);border:1px solid var(--line-2);color:#eef1f7;font-size:12.5px;font-weight:700;
    padding:10px 16px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:var(--shadow);white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .footnote{padding:20px 18px 8px;font-size:10.5px;line-height:1.7;color:#565e6d;text-align:center}
  .footnote b{color:#7c8698}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="logo">🔥</div>
      <div class="brand">
        <b>바이럴 뉴스</b>
        <span id="brand-sub">오늘의 핫이슈 랭킹</span>
      </div>
      <div class="top-right">
        <span class="live"><i></i>LIVE</span>
        <button class="icon-btn" id="btn-reload" aria-label="새로고침" title="새로고침">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="stale" id="stale">
    <span>⏳ 데이터가 오래됐어요</span>
    <button id="stale-btn">새로고침</button>
  </div>

  <div class="filters" id="filters">
    <div class="seg" id="sortseg">
      <button data-sort="viral" class="on">🏆 바이럴 순위</button>
      <button data-sort="latest">⚡ 최신 속보순</button>
    </div>
    <div class="chips" id="timechips"></div>
    <div class="chips cats" id="catchips"></div>
  </div>

  <main id="main"></main>

  <div class="footnote" id="footnote"></div>

<script>
(function(){
  "use strict";

  /* ---------------- data ---------------- */
  var DATA = JSON.parse(document.getElementById('news-data').textContent || '{}');
  var ARTICLES = Array.isArray(DATA.articles) ? DATA.articles : [];
  var COUNTS = DATA.counts || {};
  var NOW0 = Date.now();

  /* ---------------- storage (file:// 안전) ---------------- */
  var MEM = {};
  var LS = (function(){
    try {
      var k = '__vn_test__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      return function(){ return window.localStorage; };
    } catch(e){
      return function(){
        return {
          getItem: function(k){ return Object.prototype.hasOwnProperty.call(MEM,k) ? MEM[k] : null; },
          setItem: function(k,v){ MEM[k] = String(v); },
          removeItem: function(k){ delete MEM[k]; }
        };
      };
    }
  })();
  var KEY = 'viralnews.bookmarks.v1';

  function loadSaved(){
    try {
      var raw = LS().getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function(x){ return x && x.link; }) : [];
    } catch(e){ return []; }
  }
  function persist(){
    try { LS().setItem(KEY, JSON.stringify(savedList)); } catch(e){}
    if (savedSet) savedSetClear();
    savedList.forEach(function(x){ savedSet.add(x.link); });
    paintSavedDot();
  }
  var savedList = loadSaved();
  var savedSet = new Set();
  function savedSetClear(){ savedSet = new Set(); }
  savedList.forEach(function(x){ savedSet.add(x.link); });

  function isSaved(link){ return savedSet.has(link); }

  function toggleSave(a){
    if (isSaved(a.link)) {
      savedList = savedList.filter(function(x){ return x.link !== a.link; });
      toast('저장함에서 삭제했어요');
    } else {
      savedList.unshift(snapshot(a));
      toast('저장함에 담았어요');
    }
    persist();
    render();
    if (sheetOpen && sheetData) paintSheetSaveBtn();
  }

  function snapshot(a){
    return {
      link: a.link, title: a.title, publisher: a.publisher, score: a.score,
      category: a.category, summary: a.summary, viral_point: a.viral_point,
      published_ts: a.published_ts, published_at: a.published_at,
      is_breaking: a.is_breaking, metrics: a.metrics, tags: a.tags,
      outlets: a.outlets, reason: a.reason, image: a.image, saved_at: Date.now()
    };
  }

  function paintSavedDot(){
    var dot = document.getElementById('saved-dot');
    if (!dot) return;
    var n = savedList.length;
    dot.textContent = n > 99 ? '99+' : String(n);
    dot.classList.toggle('on', n > 0);
  }

  /* ---------------- helpers ---------------- */
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function pad(n){ return n < 10 ? '0' + n : String(n); }

  function fmtAgo(ts){
    if (!ts) return '시각 미상';
    var diff = Date.now() - ts;
    if (diff < 0) diff = 0;
    var m = Math.floor(diff / 60000);
    if (m < 1) return '방금 전';
    if (m < 60) return m + '분 전';
    var h = Math.floor(m / 60);
    if (h < 24) return h + '시간 전';
    var d = Math.floor(h / 24);
    if (d === 1) return '어제';
    if (d < 7) return d + '일 전';
    return Math.floor(d / 7) + '주 전';
  }
  function fmtClock(ts){
    if (!ts) return '--:--';
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function isToday(ts){
    if (!ts) return false;
    return new Date(ts).toDateString() === new Date().toDateString();
  }
  function ageMin(ts){ return ts ? Math.max(0, (Date.now() - ts) / 60000) : 99999; }

  /* ---------------- state ---------------- */
  var state = { tab: 'rank', sort: 'viral', time: 'all', cat: 'all' };

  var TIME_FILTERS = [
    { id:'all',      label:'전체' },
    { id:'breaking', label:'속보' },
    { id:'1h',       label:'1시간 이내' },
    { id:'3h',       label:'3시간 이내' },
    { id:'today',    label:'오늘' }
  ];
  var CATS = [
    { id:'all',      label:'🔥 전체 HOT' },
    { id:'사건사고', label:'🚨 사건사고' },
    { id:'얼탱없음', label:'🤯 얼탱없음' },
    { id:'감동',     label:'🥹 감동' },
    { id:'이슈',     label:'💬 이슈' }
  ];

  function passTime(a, f){
    if (f === 'all') return true;
    if (f === 'breaking') return !!a.is_breaking;
    if (f === '1h') return ageMin(a.published_ts) <= 60;
    if (f === '3h') return ageMin(a.published_ts) <= 180;
    if (f === 'today') return isToday(a.published_ts);
    return true;
  }
  function passCat(a, c){ return c === 'all' || a.category === c; }

  function sortList(list){
    var arr = list.slice();
    if (state.sort === 'latest') {
      arr.sort(function(x,y){
        var bx = x.is_breaking ? 1 : 0, by = y.is_breaking ? 1 : 0;
        if (by !== bx) return by - bx;
        return (y.published_ts || 0) - (x.published_ts || 0);
      });
    } else {
      arr.sort(function(x,y){
        if (y.score !== x.score) return y.score - x.score;
        return (y.published_ts || 0) - (x.published_ts || 0);
      });
    }
    return arr;
  }

  /* ---------------- card ---------------- */
  function scoreClass(s){ return s >= 80 ? 's-hi' : (s >= 62 ? 's-md' : ''); }

  function cardHTML(a, idx, opts){
    opts = opts || {};
    var rank = opts.noRank ? 0 : ((typeof idx === 'number') ? idx + 1 : (a.rank || 0));
    var rkCls = rank === 1 ? ' r1' : rank === 2 ? ' r2' : rank === 3 ? ' r3' : '';
    var topCls = rank === 1 ? ' top1' : rank === 2 ? ' top2' : rank === 3 ? ' top3' : '';
    var img = a.image ? '<img class="thumb' + (opts.compact ? ' sm' : '') + '" src="' + esc(a.image) + '" alt="" loading="lazy" decoding="async" data-img="1">' : '';
    var bookmarked = isSaved(a.link);
    var bBtn = opts.noBookmark ? '' :
      '<button class="bm' + (bookmarked ? ' on' : '') + '" data-bm="' + esc(a.link) + '" aria-label="' + (bookmarked ? '북마크 해제' : '북마크') + '">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="' + (bookmarked ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1Z"/></svg></button>';
    var timeTxt = opts.rail ? fmtClock(a.published_ts) : fmtAgo(a.published_ts);
    var nOut = (a.outlets && a.outlets.length) || 1;
    var nOutMark = nOut > 1 ? '<span class="meta-dot">·</span><span class="ago">' + nOut + '개 매체</span>' : '';

    return '' +
      '<article class="card' + topCls + '" data-open="' + esc(a.link) + '">' +
        (opts.rail ? '<span class="t-abs">' + timeTxt + '</span>' : '') +
        '<div class="c-top">' +
          (rank ? '<span class="rank' + rkCls + '">' + rank + '</span>' : '') +
          '<span class="tag ' + esc(a.category) + '">' + esc(a.category) + '</span>' +
          (a.is_breaking ? '<span class="badge-b">속보</span>' : '') +
          '<span class="sp"></span>' +
          '<span class="score ' + scoreClass(a.score) + '">' + (a.score | 0) + '<i>점</i></span>' +
        '</div>' +
        img +
        '<h3 class="title">' + esc(a.title) + '</h3>' +
        ((a.summary && a.summary.length >= 24) ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
        '<p class="vpoint"><b>바이럴 포인트</b>' + esc(a.viral_point) + '</p>' +
        '<div class="c-foot">' +
          '<span class="pub">' + esc(a.publisher) + '</span>' +
          '<span class="meta-dot">·</span>' +
          '<span class="ago">' + timeTxt + '</span>' +
          nOutMark +
          '<span class="sp"></span>' +
          bBtn +
          '<a class="src" href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer" data-ext="1">원문 ↗</a>' +
        '</div>' +
      '</article>';
  }

  /* ---------------- views ---------------- */
  function feedHTML(list, opts){
    if (!list.length) return emptyHTML(opts && opts.empty);
    var html = '<div class="feed">';
    for (var i = 0; i < list.length; i++) html += cardHTML(list[i], i, opts);
    return html + '</div>';
  }

  function emptyHTML(o){
    o = o || {};
    return '<div class="empty"><div class="ic">' + (o.ic || '🔍') + '</div><b>' + esc(o.title || '표시할 기사가 없어요') + '</b><p>' + esc(o.desc || '다른 필터를 선택해 보세요.') + '</p></div>';
  }

  function renderRank(){
    var list = ARTICLES.filter(function(a){ return passTime(a, state.time) && passCat(a, state.cat); });
    list = sortList(list);
    var total = ARTICLES.length;
    var head = '<div class="sec-head"><b class="bar" style="display:none"></b><h2>' +
      (state.sort === 'viral' ? '바이럴 랭킹' : '최신 속보') + '</h2><span>' + list.length + '건 / 전체 ' + total + '건</span><span class="line"></span></div>';
    var emptyOpt = state.cat !== 'all'
      ? { ic:'🥲', title:'이 카테고리에 기사가 없어요', desc:'시간 필터를 ‘전체’로 바꾸거나 다른 카테고리를 눌러 보세요.' }
      : { ic:'😴', title:'조건에 맞는 기사가 없어요', desc:'시간 필터를 ‘전체’로 바꿔 보세요.' };
    return head + feedHTML(list, { empty: emptyOpt });
  }

  var GROUPS = [
    { id:'g1', label:'1시간 이내', test:function(m){ return m <= 60; } },
    { id:'g3', label:'1~3시간',    test:function(m){ return m > 60 && m <= 180; } },
    { id:'g6', label:'3~6시간',    test:function(m){ return m > 180 && m <= 360; } },
    { id:'g12',label:'6~12시간',   test:function(m){ return m > 360 && m <= 720; } },
    { id:'gt', label:'오늘',        test:function(m){ return m > 720 && m <= 1440; } },
    { id:'old',label:'그 이전',     test:function(m){ return m > 1440; } }
  ];

  function renderTime(){
    var list = sortList(ARTICLES.filter(function(a){ return passCat(a, state.cat); }));
    if (!list.length) return emptyHTML({ ic:'🕰️', title:'아직 기사가 없어요', desc:'수집된 기사가 없습니다. 수집기를 다시 실행해 주세요.' });
    var html = '<div class="sec-head"><h2>시간대별 흐름</h2><span>' + list.length + '건</span><span class="line"></span></div>';
    var used = {};
    GROUPS.forEach(function(g){
      var items = list.filter(function(a){ return g.test(ageMin(a.published_ts)); });
      if (!items.length) return;
      items.forEach(function(a){ used[a.link] = 1; });
      html += '<div class="group"><div class="g-head"><span class="bar"></span><b>' + g.label + '</b><span class="n">' + items.length + '건</span><span class="line"></span></div>' +
        '<div class="feed">';
      items.forEach(function(a){ html += cardHTML(a, null, { noRank: true }); });
      html += '</div></div>';
    });
    return html;
  }

  function renderBreaking(){
    var list = ARTICLES.filter(function(a){ return a.is_breaking && passCat(a, state.cat); })
      .sort(function(x,y){ return (y.published_ts || 0) - (x.published_ts || 0); });
    if (!list.length) return emptyHTML({ ic:'📰', title:'지금은 속보가 없어요', desc:'속보가 들어오면 이곳에 시간순으로 쌓입니다.' });
    var html = '<div class="sec-head"><h2>속보 타임라인</h2><span>' + list.length + '건 · 최신순</span><span class="line"></span></div><div class="rail">';
    list.forEach(function(a){ html += cardHTML(a, null, { rail:true }); });
    return html + '</div>';
  }

  function renderSaved(){
    if (!savedList.length) {
      return emptyHTML({ ic:'🔖', title:'저장한 기사가 없어요', desc:'카드 오른쪽 북마크 아이콘을 누르면 이곳에 모여요. 나중에 다시 읽고 싶은 기사를 담아 두세요.' });
    }
    var html = '<div class="sec-head"><h2>저장함</h2><span>' + savedList.length + '건</span><span class="line"></span>' +
      '<button class="icon-btn" id="btn-clear" aria-label="전체 삭제" style="width:auto;padding:0 9px;height:26px;font-size:11px;font-weight:800">전체 삭제</button></div><div class="feed">';
    savedList.forEach(function(a, i){
      var item = Object.assign({}, a);
      if (!item.viral_point) item.viral_point = '저장한 기사';
      html += cardHTML(item, null, { noRank: true });
    });
    return html + '</div>';
  }

  function render(){
    var main = document.getElementById('main');
    var html = '';
    if (state.tab === 'rank') html = renderRank();
    else if (state.tab === 'time') html = renderTime();
    else if (state.tab === 'breaking') html = renderBreaking();
    else html = renderSaved();
    main.innerHTML = html;
    var inSaved = (state.tab === 'saved');
    var timeView = (state.tab === 'time');
    var breakView = (state.tab === 'breaking');
    document.getElementById('filters').style.display = inSaved ? 'none' : '';
    document.getElementById('sortseg').style.display = (timeView || breakView) ? 'none' : '';
    document.getElementById('timechips').style.display = timeView ? 'none' : '';
    paintChips();
    paintTabs();
    paintSavedDot();
    paintStale();
  }

  /* ---------------- chips ---------------- */
  function paintChips(){
    var t = document.getElementById('timechips');
    var counts = { all: ARTICLES.length, breaking: COUNTS['속보'] || 0 };
    t.innerHTML = TIME_FILTERS.map(function(f){
      var n = '';
      if (f.id === 'all') n = String(ARTICLES.length);
      else if (f.id === 'breaking') n = String(ARTICLES.filter(function(a){ return a.is_breaking; }).length);
      else if (f.id === '1h') n = String(ARTICLES.filter(function(a){ return ageMin(a.published_ts) <= 60; }).length);
      else if (f.id === '3h') n = String(ARTICLES.filter(function(a){ return ageMin(a.published_ts) <= 180; }).length);
      else if (f.id === 'today') n = String(ARTICLES.filter(function(a){ return isToday(a.published_ts); }).length);
      return '<button class="chip' + (state.time === f.id ? ' on' : '') + '" data-time="' + f.id + '">' + f.label + '<span class="n">' + n + '</span></button>';
    }).join('');

    var c = document.getElementById('catchips');
    c.innerHTML = CATS.map(function(cat){
      var n = cat.id === 'all' ? ARTICLES.length : ARTICLES.filter(function(a){ return a.category === cat.id; }).length;
      return '<button class="chip' + (state.cat === cat.id ? ' on' : '') + '" data-cat="' + cat.id + '">' + cat.label + '<span class="n">' + n + '</span></button>';
    }).join('');

    var seg = document.getElementById('sortseg');
    Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-sort') === state.sort);
    });
  }

  function paintTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('#tabbar button'), function(b){
      b.classList.toggle('on', b.getAttribute('data-tab') === state.tab);
    });
  }

  function paintStale(){
    var el = document.getElementById('stale');
    if (!el) return;
    var gen = DATA.generated_at ? Date.parse(DATA.generated_at) : 0;
    var stale = gen && (Date.now() - gen) > 3 * 3600 * 1000;
    el.classList.toggle('on', !!stale);
  }

  /* ---------------- sheet ---------------- */
  var sheetOpen = false, sheetData = null;

  function findArticle(link){
    for (var i = 0; i < ARTICLES.length; i++) if (ARTICLES[i].link === link) return ARTICLES[i];
    for (var j = 0; j < savedList.length; j++) if (savedList[j].link === link) return savedList[j];
    return null;
  }

  function openSheet(a){
    if (!a) return;
    sheetData = a;
    var s = document.getElementById('sheet');
    var m = a.metrics || { spread:0, breaking:0, buzz:0 };
    var nOut = (a.outlets && a.outlets.length) || 1;
    var rank = a.rank || 0;
    var rkCls = rank === 1 ? ' r1' : rank === 2 ? ' r2' : rank === 3 ? ' r3' : '';
    var savedNow = isSaved(a.link);
    var tags = (a.tags || []).map(function(t){ return '<span class="tg">#' + esc(t) + '</span>'; }).join('');

    s.innerHTML = '' +
      '<div class="handle"></div>' +
      '<div class="sh-top">' +
        (rank ? '<span class="rank' + rkCls + '">' + rank + '위</span>' : '') +
        '<span class="tag ' + esc(a.category) + '">' + esc(a.category) + '</span>' +
        (a.is_breaking ? '<span class="badge-b">속보</span>' : '') +
        '<div class="ring" style="--v:' + (a.score || 0) + '"><div class="v">' + (a.score | 0) + '<i>점</i></div></div>' +
      '</div>' +
      '<h2 class="sh-title">' + esc(a.title) + '</h2>' +
      '<div class="sh-meta">' +
        '<b>' + esc(a.publisher) + '</b><span class="sep">·</span>' +
        '<span>' + fmtAgo(a.published_ts) + '</span>' +
        (a.published_ts ? '<span class="sep">·</span><span>' + fmtClock(a.published_ts) + '</span>' : '') +
        (nOut > 1 ? '<span class="sep">·</span><span>' + nOut + '개 매체 동시 보도</span>' : '') +
      '</div>' +
      ((a.summary && a.summary.length >= 24) ? '<div class="blk"><h4>한 줄 요약</h4><p>' + esc(a.summary) + '</p></div>' : '') +
      '<div class="blk vp"><h4>왜 바이럴일까</h4><p>' + esc(a.viral_point) + '</p></div>' +
      '<div class="blk"><h4>바이럴 점수 세부 지표</h4><div class="metrics">' +
        '<div class="m-row m1"><span>확산도</span><div class="m-bar"><i style="width:' + Math.max(2, m.spread || 0) + '%"></i></div><b>' + (m.spread || 0) + '</b></div>' +
        '<div class="m-row m2"><span>속보성</span><div class="m-bar"><i style="width:' + Math.max(2, m.breaking || 0) + '%"></i></div><b>' + (m.breaking || 0) + '</b></div>' +
        '<div class="m-row m3"><span>화제성</span><div class="m-bar"><i style="width:' + Math.max(2, m.buzz || 0) + '%"></i></div><b>' + (m.buzz || 0) + '</b></div>' +
      '</div>' +
      (a.reason ? '<p style="margin:9px 0 0;font-size:11px;color:#7c8698">' + esc(a.reason) + '</p>' : '') +
      '</div>' +
      (tags ? '<div class="tagrow">' + tags + '</div>' : '') +
      '<div class="sh-actions">' +
        '<a class="btn primary" href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">원문 기사 바로가기 ↗</a>' +
        '<button class="btn ghost' + (savedNow ? ' on' : '') + '" id="sh-save" aria-label="북마크">' +
          '<svg width="19" height="19" viewBox="0 0 24 24" fill="' + (savedNow ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1Z"/></svg>' +
        '</button>' +
        '<button class="btn ghost" id="sh-share" aria-label="공유">' +
          '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/></svg>' +
        '</button>' +
      '</div>' +
      '<div style="height:6px"></div>';

    document.getElementById('sheet-wrap').classList.add('on');
    document.getElementById('sheet-wrap').setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    sheetOpen = true;

    document.getElementById('sh-save').addEventListener('click', function(ev){
      ev.stopPropagation();
      toggleSave(findArticle(a.link) || a);
    });
    document.getElementById('sh-share').addEventListener('click', function(){
      var shareData = { title: a.title, text: a.title + ' (' + a.publisher + ')', url: a.link };
      if (navigator.share) {
        navigator.share(shareData).catch(function(){});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(a.link).then(function(){ toast('링크를 복사했어요'); }, function(){ toast('공유를 지원하지 않아요'); });
      } else {
        toast('공유를 지원하지 않아요');
      }
    });
  }

  function paintSheetSaveBtn(){
    var btn = document.getElementById('sh-save');
    if (!btn || !sheetData) return;
    var on = isSaved(sheetData.link);
    btn.classList.toggle('on', on);
    var svg = btn.querySelector('svg');
    if (svg) svg.setAttribute('fill', on ? 'currentColor' : 'none');
  }

  function closeSheet(){
    document.getElementById('sheet-wrap').classList.remove('on');
    document.getElementById('sheet-wrap').setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    sheetOpen = false;
    sheetData = null;
  }

  /* ---------------- toast ---------------- */
  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1900);
  }

  /* ---------------- events ---------------- */
  document.getElementById('main').addEventListener('click', function(ev){
    var bm = ev.target.closest('[data-bm]');
    if (bm) {
      ev.preventDefault(); ev.stopPropagation();
      var link = bm.getAttribute('data-bm');
      var a = findArticle(link);
      if (a) toggleSave(a);
      return;
    }
    var ext = ev.target.closest('[data-ext]');
    if (ext) { ev.stopPropagation(); return; }
    var card = ev.target.closest('[data-open]');
    if (card) {
      ev.preventDefault();
      openSheet(findArticle(card.getAttribute('data-open')));
      return;
    }
    var clr = ev.target.closest('#btn-clear');
    if (clr) {
      savedList = [];
      persist();
      render();
      toast('저장함을 비웠어요');
    }
  });

  document.getElementById('filters').addEventListener('click', function(ev){
    var t = ev.target.closest('[data-time]');
    if (t) { state.time = t.getAttribute('data-time'); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    var c = ev.target.closest('[data-cat]');
    if (c) { state.cat = c.getAttribute('data-cat'); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    var s = ev.target.closest('[data-sort]');
    if (s) { state.sort = s.getAttribute('data-sort'); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  });

  document.getElementById('tabbar').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-tab]');
    if (!b) return;
    state.tab = b.getAttribute('data-tab');
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  document.getElementById('backdrop').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && sheetOpen) closeSheet(); });

  // 스와이프로 시트 닫기
  (function(){
    var startY = null;
    var sheet = document.getElementById('sheet');
    sheet.addEventListener('touchstart', function(e){ if (sheet.scrollTop <= 0) startY = e.touches[0].clientY; }, {passive:true});
    sheet.addEventListener('touchmove', function(e){
      if (startY === null) return;
      var dy = e.touches[0].clientY - startY;
      if (dy > 70) { startY = null; closeSheet(); }
    }, {passive:true});
    sheet.addEventListener('touchend', function(){ startY = null; }, {passive:true});
  })();

  document.getElementById('btn-reload').addEventListener('click', function(){ location.reload(); });
  var sb = document.getElementById('stale-btn');
  if (sb) sb.addEventListener('click', function(){ location.reload(); });

  // 깨진 이미지 숨김
  document.addEventListener('error', function(e){
    var el = e.target;
    if (el && el.getAttribute && el.getAttribute('data-img')) el.style.display = 'none';
  }, true);

  /* ---------------- boot ---------------- */
  function boot(){
    var sub = document.getElementById('brand-sub');
    if (sub && DATA.generated_at_label) sub.textContent = DATA.generated_at_label + ' 기준 · ' + ARTICLES.length + '건';
    document.getElementById('footnote').innerHTML =
      '<b>바이럴 뉴스</b> · 국내 언론사 RSS ' + ((DATA.sources || []).length || 0) + '곳을 모아 바이럴 점수로 정리했어요.<br>' +
      '점수 = 확산도(동시 보도 매체 수) + 속보성(발행·속보 여부) + 화제성(반응 키워드)<br>' +
      '최근 ' + (DATA.window_hours || 48) + '시간 기사 · ' + (DATA.generated_at_label || '') + ' 갱신<br>' +
      '새 뉴스로 업데이트: <b>python3 viral-news-app/fetch_news.py</b>';
    paintSavedDot();
    render();
  }
  boot();

  // 경과 시간 주기적 갱신
  setInterval(function(){
    if (document.hidden) return;
    if (sheetOpen) return;
    if (state.tab === 'saved') return;
    render();
  }, 60000);
})();
</script>
</body>
</html>
